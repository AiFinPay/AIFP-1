openapi: 3.1.0
info:
  title: AiFinPay AIFP-1 Merchant Monetization API
  version: 1.0.0-draft
  summary: HTTP 402 merchant-monetization protocol for AI-agent traffic.
  description: |
    Machine-readable reference contract for the AIFP-1 draft specification.
    AIFP-1 is the merchant AI-traffic/resource monetization profile. It uses
    HTTP 402 but is not identical to AIFP-2/x402.

    Current AIFP-1 reference action prices are gross payer prices:
      - standard: USD 0.0005
      - complex: USD 0.002
      - premium: USD 0.005

    Current AIFP-1 economics:
      - settlement semantics: gross-inclusive / fee-from-gross
      - treasury_bps: 100 (1% AiFinPay protocol fee)
      - creator_bps: 0
      - merchant share: 99% of gross
      - payer settlement amount: exactly the quoted gross amount
      - fee-on-top: not permitted

    Budget and other payer/account spend-policy rejection belongs before signing
    or broadcasting. Once a payer has executed a settlement matching an already-
    issued payable quote, settlement verification must not withhold the receipt
    solely because a budget threshold is discovered after payment.

    AIFP-2/x402 is a separate 0/0 route profile and is outside this OpenAPI
    contract. This specification does not claim that every route, asset, chain,
    or hosted endpoint is production-live.
  contact:
    name: AiFinPay Protocol Team
    url: https://aifinpay.io
    email: protocol@aifinpay.io
  license:
    name: Apache-2.0
    identifier: Apache-2.0
  x-protocol: AIFP-1
  x-status: draft
  x-economics:
    settlement_semantics: gross-inclusive
    treasury_bps: 100
    creator_bps: 0
    merchant_share: "0.99"
    protocol_fee_share: "0.01"
    standard_gross_usd: "0.0005"
    complex_gross_usd: "0.002"
    premium_gross_usd: "0.005"

servers:
  - url: https://api.aifinpay.io
    description: AiFinPay API host when the referenced AIFP-1 service is enabled

security:
  - bearerAuth: []

tags:
  - name: Quote
    description: Create binding gross-inclusive AIFP-1 merchant-payment quotes.
  - name: Settlement
    description: Verify payer-executed settlements before receipt issuance.
  - name: Receipt
    description: Retrieve settlement-backed AIFP-1 receipts.
  - name: Verification
    description: Verify receipt keys and, optionally, receipt claims.

paths:
  /v1/quote:
    post:
      tags: [Quote]
      operationId: createAifp1Quote
      summary: Create a binding AIFP-1 quote
      description: |
        A payable quote MUST only be returned for a settlement route that the
        active verifier can validate. Unsupported or unverifiable routes must
        fail before the payer is instructed to send funds.

        Payer/account budget and spend-policy checks MUST also be resolved before
        the payer signs or broadcasts. A budget rejection belongs at this stage
        (or in the local SDK/wallet policy layer), not after a valid settlement.

        The quoted gross_amount is the full AIFP-1 commercial amount paid by
        the payer. The protocol fee is deducted from gross; it is not added on
        top. For current AIFP-1 economics, payer_total_amount equals gross_amount,
        merchant_amount is 99% of gross, protocol_fee_amount is 1% of gross,
        and creator_amount is zero.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            examples:
              standard:
                value:
                  merchant_id: mrch_example
                  resource: /api/data
                  pricing_tier: standard
                  units: 1
      responses:
        '200':
          description: Binding quote issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
              examples:
                standard:
                  value:
                    quote_id: qt_example
                    protocol: AIFP-1
                    route_class: AIFP-1
                    merchant_id: mrch_example
                    resource: /api/data
                    pricing_tier: standard
                    gross_amount: "0.0005"
                    payer_total_amount: "0.0005"
                    merchant_amount: "0.000495"
                    protocol_fee_amount: "0.000005"
                    creator_amount: "0"
                    currency: USD
                    treasury_bps: 100
                    creator_bps: 0
                    asset: USDC
                    chain: polygon
                    settlement_target: "0xExampleSettlementTarget"
                    expires_at: "2026-08-15T12:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Proposed payment is rejected by a pre-payment payer/account budget or policy rule. No payable quote should be acted on and no settlement should be broadcast.
        '409':
          description: Requested profile conflicts with route policy.
        '422':
          description: Requested asset/chain/profile is unsupported, unverifiable, or economically inconsistent.
        '503':
          description: No verifiable settlement route is currently available.

  /v1/pay:
    post:
      tags: [Settlement]
      operationId: verifyAifp1SettlementAndIssueReceipt
      summary: Verify a payer-executed settlement and issue a receipt
      description: |
        The payer signs and broadcasts the settlement using its own wallet or
        another explicitly supported payer rail. This endpoint verifies the
        submitted settlement reference against the binding quote, including
        the gross-inclusive 99/1 AIFP-1 split. A receipt MUST NOT be issued
        unless settlement verification succeeds.

        This is a post-payment verification endpoint. If the payer executed a
        settlement that validly matches an already-issued payable quote, this
        endpoint MUST NOT deny the corresponding receipt solely because a budget
        or spend-policy threshold is discovered after settlement. Budget/policy
        rejection must happen before signing/broadcasting.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRequest'
            examples:
              polygon:
                value:
                  quote_id: qt_example
                  chain: polygon
                  asset: USDC
                  tx_ref: "0xExampleTransactionHash"
      responses:
        '200':
          description: Settlement verified and receipt issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '202':
          description: Settlement observed but finality is still pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingSettlement'
        '409':
          description: Duplicate/replay/idempotency conflict.
        '410':
          description: Quote expired or is no longer payable.
        '422':
          description: Settlement does not match the quote or required gross-inclusive economics.
        '503':
          description: Settlement verifier unavailable; no receipt issued. Reconcile the same settlement reference rather than broadcasting a replacement payment.

  /v1/receipt/{receipt_id}:
    get:
      tags: [Receipt]
      operationId: getAifp1Receipt
      summary: Retrieve receipt or settlement status
      parameters:
        - name: receipt_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Receipt record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receipt'
        '404':
          description: Receipt not found.

  /v1/verify:
    post:
      tags: [Verification]
      operationId: assistedReceiptVerification
      summary: Optional assisted receipt verification
      description: |
        Merchant implementations SHOULD verify receipt signatures and claims
        locally. This endpoint is an optional compatibility helper and does not
        replace settlement verification before receipt issuance.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
      responses:
        '200':
          description: Verification decision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResult'
        '422':
          description: Invalid or mismatched receipt.

  /.well-known/jwks.json:
    get:
      tags: [Verification]
      operationId: getReceiptVerificationKeys
      summary: Public keys for receipt verification
      security: []
      responses:
        '200':
          description: JSON Web Key Set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
        '503':
          description: Verification-key service unavailable.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
      description: Unique key used to prevent duplicate settlement-verification processing. It does not authorize a second payment.

  schemas:
    PricingTier:
      type: string
      enum: [standard, complex, premium]

    RouteClass:
      type: string
      const: AIFP-1

    DecimalString:
      type: string
      pattern: '^[0-9]+(?:\.[0-9]+)?$'
      examples: ["0.0005"]

    QuoteRequest:
      type: object
      additionalProperties: false
      required: [merchant_id, resource, pricing_tier]
      properties:
        merchant_id:
          type: string
          minLength: 1
        resource:
          type: string
          minLength: 1
        scope:
          type: string
          description: Optional exact/prefix/merchant scope requested by the payer.
        pricing_tier:
          $ref: '#/components/schemas/PricingTier'
        units:
          type: integer
          minimum: 1
          default: 1
        preferred_asset:
          type: string
        preferred_chain:
          type: string

    Quote:
      type: object
      additionalProperties: true
      required:
        - quote_id
        - protocol
        - route_class
        - merchant_id
        - resource
        - gross_amount
        - payer_total_amount
        - merchant_amount
        - protocol_fee_amount
        - creator_amount
        - treasury_bps
        - creator_bps
        - expires_at
      properties:
        quote_id:
          type: string
        protocol:
          type: string
          const: AIFP-1
        route_class:
          $ref: '#/components/schemas/RouteClass'
        merchant_id:
          type: string
        resource:
          type: string
        scope:
          type: string
        pricing_tier:
          $ref: '#/components/schemas/PricingTier'
        gross_amount:
          allOf:
            - $ref: '#/components/schemas/DecimalString'
          description: Full commercial amount the payer settles for AIFP-1, excluding external gas/network cost.
        payer_total_amount:
          allOf:
            - $ref: '#/components/schemas/DecimalString'
          description: Settlement-rail payer amount. For current AIFP-1 it must equal gross_amount.
        merchant_amount:
          allOf:
            - $ref: '#/components/schemas/DecimalString'
          description: Merchant net share derived from gross; 99% under the current AIFP-1 profile.
        protocol_fee_amount:
          allOf:
            - $ref: '#/components/schemas/DecimalString'
          description: AiFinPay share derived from gross; 1% under the current AIFP-1 profile.
        creator_amount:
          allOf:
            - $ref: '#/components/schemas/DecimalString'
          description: Creator/referral share; zero under the current AIFP-1 profile.
        currency:
          type: string
          default: USD
        treasury_bps:
          type: integer
          const: 100
        creator_bps:
          type: integer
          const: 0
        asset:
          type: string
        chain:
          type: string
        settlement_target:
          type: string
        payment_id:
          type: string
        order_id:
          type: string
        expires_at:
          type: string
          format: date-time

    PayRequest:
      type: object
      additionalProperties: false
      required: [quote_id, chain, asset, tx_ref]
      properties:
        quote_id:
          type: string
        chain:
          type: string
        asset:
          type: string
        tx_ref:
          type: string
          minLength: 1

    Receipt:
      type: object
      additionalProperties: true
      required:
        - receipt_id
        - protocol
        - route_class
        - merchant_id
        - gross_amount
        - merchant_amount
        - protocol_fee_amount
        - creator_amount
        - status
        - receipt
        - issued_at
        - expires_at
      properties:
        receipt_id:
          type: string
        protocol:
          type: string
          const: AIFP-1
        route_class:
          $ref: '#/components/schemas/RouteClass'
        merchant_id:
          type: string
        resource:
          type: string
        scope:
          type: string
        quote_id:
          type: string
        tx_ref:
          type: string
        gross_amount:
          $ref: '#/components/schemas/DecimalString'
        merchant_amount:
          $ref: '#/components/schemas/DecimalString'
        protocol_fee_amount:
          $ref: '#/components/schemas/DecimalString'
        creator_amount:
          $ref: '#/components/schemas/DecimalString'
        treasury_bps:
          type: integer
          const: 100
        creator_bps:
          type: integer
          const: 0
        status:
          type: string
          enum: [settled, final]
        receipt:
          type: string
          description: Signed receipt token or encoded receipt according to the active receipt profile.
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time

    PendingSettlement:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: pending
        receipt_id:
          type: string
        retry_after_seconds:
          type: integer
          minimum: 1

    VerifyRequest:
      type: object
      additionalProperties: false
      required: [receipt, merchant_id, resource]
      properties:
        receipt:
          type: string
        merchant_id:
          type: string
        resource:
          type: string
        required_amount:
          allOf:
            - $ref: '#/components/schemas/DecimalString'
          description: Required gross paid amount or quota-equivalent amount for the requested resource.

    VerifyResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        reason:
          type: string
        claims:
          type: object
          additionalProperties: true

    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            additionalProperties: true

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
        detail:
          type: string

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
