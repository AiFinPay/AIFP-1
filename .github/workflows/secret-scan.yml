name: Secret Scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gitleaks:
    name: Scan current tree for secrets with gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          version="8.30.1"
          archive="gitleaks_${version}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSL "${base}/${archive}" -o "/tmp/${archive}"
          curl -fsSL "${base}/gitleaks_${version}_checksums.txt" -o /tmp/gitleaks-checksums.txt
          cd /tmp
          grep " ${archive}$" gitleaks-checksums.txt | sha256sum --check --strict
          tar -xzf "${archive}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan current repository tree
        run: gitleaks dir --redact --no-banner --verbose .
